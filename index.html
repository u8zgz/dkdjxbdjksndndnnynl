<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuke the Korthian</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            z-index: 10;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="score-board">Korthians Nuked: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let score = 0;
        let targets = [];
        let explosions = [];

        function createImage(src) {
            const img = new Image();
            img.onerror = () => console.error(`Failed to load image: ${src}`);
            img.src = src;
            return img;
        }

        const bgImage = createImage('./IMG_6834.jpeg');
        const avatar1 = createImage('./IMG_6847.png');
        const avatar2 = createImage('./IMG_6848.png');

        const avatarImages = [avatar1, avatar2];

        class Korthian {
            constructor() {
                this.size = 65;
                const sidePadding = 20;
                
                const maxX = Math.max(10, canvas.width - this.size - (sidePadding * 2));
                this.x = sidePadding + Math.random() * maxX;
                
                const grassStart = canvas.height * 0.50; 
                const grassEnd = canvas.height - this.size - 20;
                
                const minY = Math.min(grassStart, grassEnd);
                const maxY = Math.max(grassStart, grassEnd);
                this.y = minY + Math.random() * Math.max(10, maxY - minY);
                
                this.image = avatarImages[Math.floor(Math.random() * avatarImages.length)];
            }

            draw() {
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.image, this.x, this.y, this.size, this.size);
                    ctx.restore();
                    
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, 0, Math.PI * 2);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else {
                    ctx.save();
                    ctx.fillStyle = '#FF3333';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 69, 0, ${this.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.radius += 4;
                this.alpha -= 0.05;
            }
        }

        setInterval(() => {
            if (targets.length < 8) {
                targets.push(new Korthian());
            }
        }, 800);

        function handleTap(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const posX = clientX - rect.left;
            const posY = clientY - rect.top;

            explosions.push(new Explosion(posX, posY));

            targets = targets.filter(target => {
                const hit = posX >= target.x && posX <= target.x + target.size &&
                            posY >= target.y && posY <= target.y + target.size;
                
                if (hit) {
                    score++;
                    scoreElement.innerText = score;
                    return false;
                }
                return true;
            });
        }

        canvas.addEventListener('click', (e) => handleTap(e.clientX, e.clientY));
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleTap(touch.clientX, touch.clientY);
        }, { passive: false });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#222222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            targets.forEach(t => t.draw());

            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update();
                explosions[i].draw();
                if (explosions[i].alpha <= 0) {
                    explosions.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
