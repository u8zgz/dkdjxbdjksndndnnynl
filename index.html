<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuke the Korthian</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #222;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            user-select: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div id="score-board">Korthians Nuked: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let score = 0;
        let targets = [];
        let explosions = [];

        const bgImage = new Image();
        bgImage.src = 'IMG_6834.jpeg';

        const robloxUserIds = [8398090850, 10122618116];
        const avatarImages = [];

        robloxUserIds.forEach(id => {
            const img = new Image();
            img.src = `https://tr.rbxcdn.com/30DAY-AvatarHeadshot-${id}-Png/150/150/AvatarHeadshot/Png`;
            img.onerror = () => {
                img.src = `https://www.roblox.com/headshot-thumbnail/image?userId=${id}&width=150&height=150&format=png`;
            };
            avatarImages.push(img);
        });

        class Korthian {
            constructor() {
                this.size = 70;
                this.x = Math.random() * (canvas.width - this.size);
                
                const grassTop = canvas.height * 0.6;
                this.y = grassTop + Math.random() * (canvas.height - grassTop - this.size);
                
                this.image = avatarImages[Math.floor(Math.random() * avatarImages.length)];
            }

            draw() {
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.drawImage(this.image, this.x, this.y, this.size, this.size);
                } else {
                    ctx.fillStyle = '#E74C3C';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 60;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 69, 0, ${this.alpha})`;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.radius += 5;
                this.alpha -= 0.04;
            }
        }

        function spawnTarget() {
            if (targets.length < 10) {
                targets.push(new Korthian());
            }
        }
        setInterval(spawnTarget, 800);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            explosions.push(new Explosion(clickX, clickY));

            targets = targets.filter(target => {
                const hit = clickX >= target.x && clickX <= target.x + target.size &&
                            clickY >= target.y && clickY <= target.y + target.size;
                
                if (hit) {
                    score++;
                    scoreElement.innerText = score;
                    return false;
                }
                return true;
            });
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            targets.forEach(t => t.draw());

            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.update();
                exp.draw();
                if (exp.alpha <= 0) {
                    explosions.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
