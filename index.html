<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuke the Korthian</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #222;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            z-index: 10;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="score-board">Korthians Nuked: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let score = 0;
        let targets = [];
        let explosions = [];

        const bgImage = new Image();
        bgImage.src = 'IMG_6834.jpeg';

        const robloxUserIds = [8398090850, 10122618116];
        const avatarImages = [];

        async function loadRobloxAvatars() {
            for (const id of robloxUserIds) {
                try {
                    const res = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=150x150&format=Png&isCircular=false`);
                    const data = await res.json();
                    if (data && data.data && data.data[0] && data.data[0].imageUrl) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = data.data[0].imageUrl;
                        avatarImages.push(img);
                    }
                } catch (err) {
                    const img = new Image();
                    img.src = `https://www.roblox.com/headshot-thumbnail/image?userId=${id}&width=150&height=150&format=png`;
                    avatarImages.push(img);
                }
            }
        }
        loadRobloxAvatars();

        class Korthian {
            constructor() {
                this.size = 60;
                const margin = 15;
                
                this.x = margin + Math.random() * (canvas.width - this.size - (margin * 2));
                
                const grassStart = canvas.height * 0.70;
                const grassEnd = canvas.height - this.size - 25;
                
                this.y = grassStart + Math.random() * Math.max(10, (grassEnd - grassStart));
                
                this.image = avatarImages.length > 0 
                    ? avatarImages[Math.floor(Math.random() * avatarImages.length)] 
                    : null;
            }

            draw() {
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.image, this.x, this.y, this.size, this.size);
                    ctx.restore();
                    
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, 0, Math.PI * 2);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#FF3333';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 69, 0, ${this.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.radius += 4;
                this.alpha -= 0.05;
            }
        }

        setInterval(() => {
            if (targets.length < 8) {
                targets.push(new Korthian());
            }
        }, 800);

        function handleTap(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const posX = clientX - rect.left;
            const posY = clientY - rect.top;

            explosions.push(new Explosion(posX, posY));

            targets = targets.filter(target => {
                const hit = posX >= target.x && posX <= target.x + target.size &&
                            posY >= target.y && posY <= target.y + target.size;
                
                if (hit) {
                    score++;
                    scoreElement.innerText = score;
                    return false;
                }
                return true;
            });
        }

        canvas.addEventListener('click', (e) => handleTap(e.clientX, e.clientY));
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleTap(touch.clientX, touch.clientY);
        }, { passive: false });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            targets.forEach(t => t.draw());

            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update();
                explosions[i].draw();
                if (explosions[i].alpha <= 0) {
                    explosions.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
