<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuke the Korthian</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #222;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            user-select: none;
            z-index: 10;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div id="score-board">Korthians Nuked: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let score = 0;
        let targets = [];
        let explosions = [];

        const bgImage = new Image();
        bgImage.src = 'IMG_6834.jpeg';

        const robloxUserIds = [8398090850, 10122618116];
        const avatarImages = [];

        async function fetchAvatars() {
            for (const id of robloxUserIds) {
                try {
                    const targetUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=150x150&format=Png`;
                    const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
                    const data = await response.json();
                    
                    if (data && data.data && data.data[0] && data.data[0].imageUrl) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = `https://corsproxy.io/?${encodeURIComponent(data.data[0].imageUrl)}`;
                        avatarImages.push(img);
                    }
                } catch (e) {
                    console.log("Avatar load error:", e);
                }
            }
        }
        fetchAvatars();

        class Korthian {
            constructor() {
                this.size = 70;
                this.x = Math.random() * (canvas.width - this.size);
                
                const grassTop = canvas.height * 0.6;
                this.y = grassTop + Math.random() * (canvas.height - grassTop - this.size);
                
                if (avatarImages.length > 0) {
                    this.image = avatarImages[Math.floor(Math.random() * avatarImages.length)];
                } else {
                    this.image = null;
                }
            }

            draw() {
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.drawImage(this.image, this.x, this.y, this.size, this.size);
                } else {
                    ctx.fillStyle = '#FF3333';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 69, 0, ${this.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.radius += 4;
                this.alpha -= 0.04;
            }
        }

        setInterval(() => {
            if (targets.length < 10) {
                targets.push(new Korthian());
            }
        }, 800);

        function handleInteraction(clientX, clientY) {
            explosions.push(new Explosion(clientX, clientY));

            targets = targets.filter(target => {
                const hit = clientX >= target.x && clientX <= target.x + target.size &&
                            clientY >= target.y && clientY <= target.y + target.size;
                
                if (hit) {
                    score++;
                    scoreElement.innerText = score;
                    return false;
                }
                return true;
            });
        }

        canvas.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            targets.forEach(t => t.draw());

            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update();
                explosions[i].draw();
                if (explosions[i].alpha <= 0) {
                    explosions.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
